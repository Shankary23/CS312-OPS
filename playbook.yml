---
- name: Configure Minecraft Server
  hosts: minecraft
  become: yes
  vars:
    s3_bucket: ""
    ecr_url: ""
    region: "us-east-1"
    image_tag: "latest"
  tasks:
    - name: Install system dependencies (Docker)
      yum:
        name: docker
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Authenticate Docker to Amazon ECR
      shell: |
        aws ecr get-login-password --region {{ region }} | docker login --username AWS --password-stdin {{ ecr_url }}
      changed_when: false

    - name: Ensure /data directory exists for world state
      file:
        path: /data
        state: directory
        mode: '0777'

    - name: Restore world data from S3 (Does not fail if bucket is empty)
      command: aws s3 sync s3://{{ s3_bucket }}/ /data/
      changed_when: false

    - name: Pull Minecraft image from ECR
      command: docker pull {{ ecr_url }}:{{ image_tag }}

    - name: Run Minecraft Container
      shell: |
        if ! docker ps -a --format '{{"{{"}}.Names{{"}}"}}' | grep -Eq "^minecraft-server\$"; then
          docker run -d \
            --name minecraft-server \
            --restart always \
            -p 25565:25565 \
            -v /data:/data \
            -e EULA=TRUE \
            -e MOTD="Shankar Server" \
            {{ ecr_url }}:{{ image_tag }}
        fi
      args:
        executable: /bin/bash